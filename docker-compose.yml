version: '3.8'

services:
  hiwkhaw-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiwkhaw_tu_rangsit
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      # ให้ข้อมูลสถานะร้านอาหารบันทึกเก็บไว้ได้แม้ restart container
      - ./server/data:/app/server/data
