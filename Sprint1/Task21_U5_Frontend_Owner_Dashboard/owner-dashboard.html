<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบหลังบ้านจัดการร้าน - TU Canteen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20">

  <!-- Mobile Frame Container (Max Width 480px Centered on Desktop) -->
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-emerald-700 text-white p-4 sticky top-0 z-30 shadow-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-emerald-800/80 flex items-center justify-center text-xl">
            🏪
          </div>
          <div>
            <h1 id="merchantShopName" class="font-bold text-base leading-tight">ร้านป้าศรี ข้าวแกงปักษ์ใต้</h1>
            <p id="merchantCanteenInfo" class="text-xs text-emerald-200">โรงอาหารกรีนแคนทีน • ล็อค 3</p>
          </div>
        </div>
        <button id="logoutBtn" class="text-xs bg-emerald-800/60 hover:bg-emerald-800 active:scale-95 px-3 py-2 rounded-xl text-emerald-100 transition-all">
          ออกจากระบบ
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 space-y-5">

      <!-- Section 1: Quick Status Toggle (Task 22) -->
      <section class="bg-gradient-to-br from-slate-50 to-emerald-50/40 border border-slate-200 rounded-3xl p-5 shadow-sm">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">สถานะหน้าร้าน</span>
            <div id="statusBadge" class="flex items-center gap-2 mt-1">
              <span id="statusDot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
              <span id="statusText" class="text-lg font-bold text-emerald-700">เปิดให้บริการ</span>
            </div>
            <p class="text-[11px] text-slate-500 mt-0.5">ลูกค้าในแอปจะเห็นร้านของคุณทันที</p>
          </div>

          <!-- Large Touch-friendly Toggle Switch (>= 48px) -->
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="shopStatusToggle" class="sr-only peer" checked>
            <div class="w-16 h-9 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-7 peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-7 after:w-7 after:transition-all peer-checked:bg-emerald-600 shadow-inner"></div>
          </label>
        </div>
      </section>

      <!-- Section 2: Operating Hours -->
      <section class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <span>⏰</span> เวลาเปิด - ปิดร้าน
          </h2>
          <button id="saveTimeBtn" class="text-xs text-emerald-700 font-semibold hover:underline">
            บันทึกเวลา
          </button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">เวลาเปิด</label>
            <input type="time" id="openTimeInput" value="07:00" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">เวลาปิด</label>
            <input type="time" id="closeTimeInput" value="15:30" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
      </section>

      <!-- Section 3: Menu & Sold Out Management -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <span>📋</span> จัดการเมนูอาหาร
            </h2>
            <p class="text-[11px] text-slate-500">กดปุ่ม "ของหมด" เพื่อแจ้งลูกค้ารีเฟรช</p>
          </div>
          <button id="openAddMenuBtn" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl font-medium shadow-sm active:scale-95 transition-all flex items-center gap-1">
            <span>+</span> เพิ่มเมนู
          </button>
        </div>

        <!-- Menu Item Cards List -->
        <div id="menuListContainer" class="space-y-2.5">
          <div class="bg-white border border-slate-200 rounded-2xl p-3.5 flex items-center justify-between shadow-sm">
            <div>
              <h3 class="font-bold text-sm text-slate-800">ข้าวราดแกงไตปลา + ไข่ต้ม</h3>
              <p class="text-xs text-emerald-700 font-semibold mt-0.5">฿45.00</p>
            </div>
            <button class="toggle-sold-out-btn px-3 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-amber-100 text-slate-700 hover:text-amber-800 active:scale-95 transition-all border border-slate-200" data-product-id="1" data-sold-out="false">
              พร้อมขาย
            </button>
          </div>

          <div class="bg-slate-50/80 border border-amber-200 rounded-2xl p-3.5 flex items-center justify-between shadow-sm opacity-90">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-bold text-sm text-slate-800 line-through text-slate-400">คั่วกลิ้งหมู</h3>
                <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">ของหมด</span>
              </div>
              <p class="text-xs text-slate-400 font-semibold mt-0.5">฿40.00</p>
            </div>
            <button class="toggle-sold-out-btn px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500 hover:bg-emerald-600 text-white active:scale-95 transition-all shadow-sm" data-product-id="2" data-sold-out="true">
              แจ้งมีของแล้ว
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Action Toast -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 transition-all opacity-0 pointer-events-none z-50">
      <span id="toastIcon">✅</span>
      <span id="toastMessage">อัปเดตสถานะสำเร็จ</span>
    </div>

  </div>

  <script src="dashboard.js"></script>
</body>
</html>
