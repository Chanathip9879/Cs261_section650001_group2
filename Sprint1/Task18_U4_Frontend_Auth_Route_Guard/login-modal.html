<!-- Modal Component: Phone + PIN Login for Merchant (Mobile-First) -->
<div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 hidden">
  <div class="bg-white dark:bg-slate-900 rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 animate-slide-up">

    <!-- Modal Header -->
    <div class="p-6 pb-4 border-b border-slate-100 dark:border-slate-800 text-center relative">
      <button id="closeLoginModalBtn" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2 text-xl font-bold">
        &times;
      </button>
      <div class="w-12 h-12 mx-auto mb-3 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl">
        🏪
      </div>
      <h3 class="text-xl font-bold text-slate-800 dark:text-slate-100">เข้าสู่ระบบเจ้าของร้าน</h3>
      <p class="text-xs text-slate-500 mt-1">โรงอาหาร มธ.รังสิต (กรีนแคนทีน / คณะวิทย์)</p>
    </div>

    <!-- Modal Body / Form -->
    <form id="ownerLoginForm" class="p-6 space-y-4">
      <div id="loginErrorAlert" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

      <!-- Phone Number Input -->
      <div>
        <label for="loginPhone" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
          เบอร์โทรศัพท์ (10 หลัก)
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">📞</span>
          <input
            type="tel"
            id="loginPhone"
            name="phone"
            maxlength="10"
            placeholder="0812345678"
            required
            class="w-full pl-9 pr-3 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white font-mono text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
        </div>
      </div>

      <!-- PIN Input -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label for="loginPin" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">
            รหัส PIN (4-6 หลัก)
          </label>
          <span class="text-[10px] text-slate-400">ตัวเลขเท่านั้น</span>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">🔒</span>
          <input
            type="password"
            id="loginPin"
            name="pin"
            maxlength="6"
            placeholder="••••"
            required
            class="w-full pl-9 pr-3 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white tracking-widest text-base focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
        </div>
      </div>

      <!-- Submit Button (Min touch target 48px) -->
      <button
        type="submit"
        id="loginSubmitBtn"
        class="w-full h-12 mt-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold rounded-xl text-sm shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>เข้าสู่ระบบ</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>

      <div class="text-center pt-2">
        <p class="text-[11px] text-slate-400">
          บัญชีทดสอบใน Demo: <code>0812345678</code> / PIN: <code>1234</code>
        </p>
      </div>
    </form>

  </div>
</div>
